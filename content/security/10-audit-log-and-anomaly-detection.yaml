lesson: sec-10
questions:
- id: sec-l10-1
  difficulty: 1
  question: "監査ログに必ず含めるべき要素は?"
  choices:
  - "スタックトレース"
  - "誰が (actor)、いつ、何に (subject)、何を (action)、どこから (IP / request_id)、結果"
  - "パスワード"
  - "リクエスト本文全部"
  answer: 1
  explanation: "個人情報や秘密は入れない。メールはハッシュで。"
- id: sec-l10-2
  difficulty: 2
  question: "監査ログを改ざんから守る置き場は?"
  choices:
  - "アプリの DB の普通のテーブル"
  - "アプリのロールは INSERT のみにし、さらに外部の保持ポリシー付きバケット (Bucket Lock / Object Lock) に流す。組織レベルで集約し、プロジェクト管理者も消せないようにする"
  - "ローカルファイル"
  - "メールで送る"
  answer: 1
  explanation: "侵害されたシステムの中にだけある記録は消される前提。"
- id: sec-l10-3
  difficulty: 2
  question: "最初にアラート化すべき検知パターンとして適切な組み合わせは?"
  choices:
  - "全ログイン"
  - "総当たり (短時間の大量失敗)、権限昇格 (管理者付与・IAM 変更)、鍵 / アクセスキーの作成、リソースの公開設定"
  - "正常なデプロイ"
  - "全 API 呼び出し"
  answer: 1
  explanation: "SCC / GuardDuty を ON にすると鍵作成・公開設定・異常 API は既定で検知される。"
- id: sec-l10-4
  difficulty: 2
  question: "不正アクセスのアラートが鳴った。最初にすべきことは?"
  choices:
  - "原因の特定"
  - "封じ込め (トークン / 鍵 / パスワードの失効、アカウント停止、IP ブロック) と証拠の保全。原因究明はその後"
  - "ログを消して再起動"
  - "何もしない"
  answer: 1
  explanation: "被害の拡大を止め、ログを消さない・上書きしない。振り返りで再発防止。"
- id: sec-l10-5
  difficulty: 1
  question: "「監査ログのシンクが止まっていた」ことに気づく仕組みが要る理由は?"
  choices:
  - "課金のため"
  - "止まっている間の記録が無く、侵害があっても追えない。シンクの書き込み件数を監視し、0 が続いたらアラート"
  - "理由は無い"
  - "ログが多すぎるから"
  answer: 1
  explanation: "「来るはずのものが来ない」の検知。cron のハートビートと同じ考え方。"
