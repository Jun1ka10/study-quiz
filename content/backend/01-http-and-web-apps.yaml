# 「Web アプリの仕組みと HTTP」の確認問題。lesson は隣の 01-http-and-web-apps.md の id と一致させる。answer は choices の添字 (0 始まり)
lesson: be-01
questions:
- id: be-l01-1
  difficulty: 1
  question: HTTP リクエストに含まれないものは?
  choices:
  - メソッド (GET / POST)
  - パス (/api/items)
  - ヘッダー
  - データベースの接続情報
  answer: 3
  explanation: リクエストはメソッド・パス・ヘッダー・(あれば) ボディ。DB はサーバーの内側の話でクライアントは知らない。
- id: be-l01-2
  difficulty: 1
  question: 「フォームを送信して保存する」処理に使う HTTP メソッドは?
  choices:
  - GET
  - POST
  - HEAD
  - OPTIONS
  answer: 1
  explanation: GET は取得で副作用なし (ブックマークや再読み込みで何度呼ばれてもよい)。状態を変える操作は POST / PUT / PATCH / DELETE。
- id: be-l01-3
  difficulty: 2
  question: Django と FastAPI の違いとして最も適切なのは?
  choices:
  - Django は Python、FastAPI は JavaScript
  - Django は ORM・管理画面・認証まで同梱のフルスタック、FastAPI は API に特化した軽量フレームワーク
  - FastAPI は DB を使えない
  - Django は API を作れない
  answer: 1
  explanation: 画面まで出す業務アプリは Django、API だけ提供して画面は Next.js に任せる構成は FastAPI、のように用途で選ぶ。
- id: be-l01-4
  difficulty: 2
  question: ステータスコード 502 / 503 / 504 を見たとき、まず疑うべき場所は?
  choices:
  - ブラウザ
  - DNS
  - ロードバランサの後ろのアプリサーバー (落ちている / 過負荷 / 遅い)
  - クライアントの送ったデータ
  answer: 2
  explanation: 5xx はサーバー側。502 は上流が応答しない、503 は過負荷やメンテ、504 は上流のタイムアウト。4xx ならクライアント側を疑う。
- id: be-p009
  difficulty: 2
  question: REST API の設計で、リソースの一部だけを更新したいときに最も適切な HTTP メソッドは?
  choices:
  - GET
  - POST
  - PUT
  - PATCH
  answer: 3
  explanation: PUT は全体置換、PATCH は部分更新。GET は副作用なし、POST は新規作成や「その他の操作」。
