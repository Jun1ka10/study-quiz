# カテゴリの並び順と説明。
#   prefix:  問題 id の接頭辞 (テストで検証)
#   planned: これから書くレッスン。ホームに「準備中」として並ぶ
# 対象は「Django + EC2 構成」と「FastAPI + Next.js + Cloud Run (Terraform) 構成」の
# 2 種類の業務アプリで実際に使われている技術を全部カバーすること。
categories:
  - id: python
    title: Python
    prefix: py
    description: 文法の基礎から、実務で困らない書き方まで
    planned:

  - id: javascript
    title: JavaScript / TypeScript
    prefix: js
    description: ブラウザで動く素の JS から、TypeScript・React・Next.js まで
    planned:

  - id: backend
    title: Web バックエンド
    prefix: be
    description: HTTP / REST から、Django・FastAPI・DB・認証まで
    planned:

  - id: docker
    title: Docker
    prefix: dk
    description: コンテナの仕組みから、本番用 Dockerfile・Cloud Run へのデプロイまで
    planned:

  - id: design
    title: 設計
    prefix: de
    description: 変更しやすく、壊れにくいコードの考え方
    planned:

  - id: security
    title: セキュリティ
    prefix: sec
    description: Web の脆弱性、認証と認可、DB の行レベル制御、秘密情報の扱い。守り方を仕組みで理解する
    planned:

  - id: aws
    title: AWS
    prefix: aws
    description: EC2 + RDS + S3 で動く Django アプリの構成を理解する
    planned:

  - id: gcp
    title: GCP
    prefix: gcp
    description: Cloud Run + Cloud SQL で動く API アプリの構成を理解する
    planned:

  - id: infra
    title: インフラ
    prefix: infra
    description: Linux・ネットワークの基礎から、IaC・CI/CD・監視まで
    planned:

  - id: devtools
    title: 開発ツール
    prefix: dt
    description: Git・GitHub・パッケージ管理・Lint・LLM API。毎日触る道具
    planned:
