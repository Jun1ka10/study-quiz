# 「Terraform の基本」の確認問題。lesson は隣の 05-terraform-basics.md の id と一致させる。answer は choices の添字 (0 始まり)
lesson: infra-05
questions:
- id: infra-l05-1
  difficulty: 1
  question: Terraform の基本的な作業の流れは?
  choices:
  - apply → plan → init
  - init (プロバイダ取得) → plan (差分確認) → apply (適用)
  - plan だけで反映される
  - init だけで反映される
  answer: 1
  explanation: plan で「何を作る / 変える / 消す」を必ず見てから apply する。特に destroy や replace が出ていないか確認する。
- id: infra-l05-2
  difficulty: 2
  question: tfstate (state ファイル) の役割は?
  choices:
  - ログ
  - Terraform が「自分が管理しているリソースの現状」を記録したもの。これと設定の差分で plan が決まる
  - バックアップ
  - 不要なファイル
  answer: 1
  explanation: state を失うと Terraform はリソースを知らない状態になり、作り直そうとする。チームでは GCS / S3 などのリモートバックエンドに置き、ロックをかける。
- id: infra-l05-3
  difficulty: 2
  question: plan の出力に `-/+ resource must be replaced` と出た。意味は?
  choices:
  - 何も起きない
  - そのリソースを一度削除して作り直す。DB やディスクならデータが消える可能性がある
  - 更新だけ
  - 警告のみで apply には影響しない
  answer: 1
  explanation: 変更できない属性 (名前やリージョンなど) を変えたときに出る。本番で見たら止まって確認する。
- id: infra-l05-4
  difficulty: 1
  question: 環境 (dev / prod) で値を変えたい項目はどこに書く?
  choices:
  - resource に直書き
  - variable で宣言し、tfvars や -var で渡す
  - state に書く
  - コメント
  answer: 1
  explanation: '`variable "project_id" {}` と宣言し、`terraform.tfvars` や `-var="project_id=..."`、環境変数 `TF_VAR_project_id` で渡す。'
- id: infra-008
  difficulty: 2
  question: Infrastructure as Code (IaC) の主なメリットとして誤っているものは?
  choices:
  - 構成をバージョン管理できる
  - 同じ環境を再現性高く構築できる
  - 手作業の設定変更が不要になる
  - 適用すると自動で必ず無停止になる
  answer: 3
  explanation: IaC は再現性・レビュー・差分管理をもたらすが、リソースの置き換えでダウンタイムが出ることはある。plan / 差分確認が重要。
