# 「Cloud Run でアプリを動かす」の確認問題。lesson は隣の 02-cloud-run.md の id と一致させる。answer は choices の添字 (0 始まり)
lesson: gcp-02
questions:
- id: gcp-l02-1
  difficulty: 1
  question: Cloud Run にデプロイするために必要なものは?
  choices:
  - VM のイメージ
  - HTTP を待ち受けるコンテナイメージ
  - Kubernetes マニフェスト
  - Java の WAR ファイル
  answer: 1
  explanation: コンテナが $PORT で HTTP を待ち受けていればよい。言語は問わない。
- id: gcp-l02-2
  difficulty: 2
  question: Cloud Run でリクエストが無いとき、既定ではどうなる?
  choices:
  - インスタンスは 1 つ動き続ける
  - インスタンスは 0 までスケールインし、課金も止まる
  - エラーになる
  - 自動で削除される
  answer: 1
  explanation: 既定は min-instances=0 でゼロスケール。初回リクエストにコールドスタートの遅延が乗るので、気になるなら min-instances を設定する。
- id: gcp-l02-3
  difficulty: 2
  question: Cloud Run のコンテナ内にファイルを書き込んで保存した。次のリクエストで読める?
  choices:
  - 常に読める
  - 同じインスタンスに当たれば読めるが保証されない。永続化は Cloud Storage や DB に
  - 読めるが遅い
  - 書き込み自体ができない
  answer: 1
  explanation: インスタンスは増減・破棄される。ローカルディスクは一時的 (しかもメモリ上)。状態は外部に持つ。
- id: gcp-l02-4
  difficulty: 2
  question: Cloud Run サービスを社内からだけ呼べるようにしたい。最も簡単なのは?
  choices:
  - --allow-unauthenticated を付ける
  - 認証を必須にし、呼び出し側に roles/run.invoker を付与する
  - URL を秘密にする
  - ポート番号を変える
  answer: 1
  explanation: 未認証を許可しなければ IAM で保護される。呼び出す側 (人・サービスアカウント) に run.invoker を付け、ID トークンを付けて呼ぶ。
- id: gcp-003
  difficulty: 1
  question: コンテナイメージをそのまま渡すと自動スケールして HTTP を受けてくれるサーバーレスサービスは?
  choices:
  - Compute Engine
  - Cloud Run
  - Cloud Functions
  - App Engine Standard
  answer: 1
  explanation: Cloud Run はコンテナベースのサーバーレス。Cloud Functions は関数単位、App Engine は言語ランタイム指定。
