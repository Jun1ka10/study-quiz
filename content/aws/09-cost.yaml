lesson: aws-09
questions:
- id: aws-l09-1
  difficulty: 1
  question: "AWS の請求で最初に設定すべきものは?"
  choices:
  - "支払い方法の追加"
  - "Budgets の予算アラート (実績と予測)。上限が無いので、気づく仕組みを先に作る"
  - "リザーブドインスタンス"
  - "サポートプラン"
  answer: 1
  explanation: "「予測が予算を超えそう」の通知で月末の驚きを防ぐ。無料枠アラートも。"
- id: aws-l09-2
  difficulty: 2
  question: "プライベートサブネットの EC2 から S3 に大量のファイルを送ったら NAT ゲートウェイの料金が跳ねた。対処は?"
  choices:
  - "EC2 をパブリックにする"
  - "S3 用のゲートウェイ型 VPC エンドポイントを作る (無料)。S3 への通信が NAT を通らなくなる"
  - "NAT を増やす"
  - "S3 をやめる"
  answer: 1
  explanation: "NAT は時間課金 + 転送量課金。S3 / DynamoDB はエンドポイントで迂回できる。"
- id: aws-l09-3
  difficulty: 1
  question: "インスタンスを終了したのに EBS の課金が続いている。原因は?"
  choices:
  - "バグ"
  - "「終了時に削除」が無効だったボリューム、または残したスナップショットに課金されている。未接続の EBS を探して消す"
  - "インスタンスが実は動いている"
  - "リージョンが違う"
  answer: 1
  explanation: "月次で「使用可能」状態の EBS と古いスナップショットを掃除する。"
- id: aws-l09-4
  difficulty: 2
  question: "Savings Plans を適用すべき対象は?"
  choices:
  - "全部"
  - "本番の EC2 / RDS のように 1 年以上確実に動き続ける分だけ。開発環境や試験的なものには適用しない"
  - "開発環境"
  - "S3"
  answer: 1
  explanation: "コミットした分は使わなくても払う。確実な分だけ 30〜60% 引きで買う。"
