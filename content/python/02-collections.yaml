# 「リスト・タプル・辞書・セット」の確認問題。lesson は隣の 02-collections.md の id と一致させる。answer は choices の添字 (0 始まり)
lesson: py-02
questions:
- id: py-l02-1
  difficulty: 1
  question: 「順序があり、あとから要素を追加・変更できる」コレクションは?
  choices:
  - tuple
  - list
  - set
  - frozenset
  answer: 1
  explanation: list は順序付きで変更可能。tuple は順序付きだが変更不可。set は順序なし。
- id: py-l02-2
  difficulty: 1
  question: '`d = {"a": 1}` のとき、キー `"b"` が無くてもエラーにならずに `None` を返す書き方は?'
  choices:
  - d["b"]
  - d.get("b")
  - d.b
  - d("b")
  answer: 1
  explanation: '`d["b"]` は KeyError。`d.get("b")` は無ければ None (第 2 引数で既定値も指定できる)。'
- id: py-l02-3
  difficulty: 2
  question: |-
    次のコードの出力は?

    ```python
    a = [1, 2, 3]
    b = a
    b.append(4)
    print(a)
    ```
  choices:
  - '[1, 2, 3]'
  - '[1, 2, 3, 4]'
  - '[4]'
  - エラー
  answer: 1
  explanation: '`b = a` は同じリストに別名を付けただけ。コピーしたいなら `b = a.copy()` や `b = list(a)`。'
- id: py-l02-4
  difficulty: 2
  question: 重複を取り除きたい。最も簡単なのは?
  choices:
  - list(set(items))
  - items.unique()
  - items.distinct()
  - for 文で 1 つずつ比較する
  answer: 0
  explanation: set は重複を持てないので、set に通してから list に戻す。ただし順序は保証されない。順序も保ちたいなら `list(dict.fromkeys(items))`。
- id: py-001
  difficulty: 1
  question: リスト `a = [1, 2, 3]` に対して `a[-1]` はどの値を返すか?
  choices:
  - '1'
  - '2'
  - '3'
  - IndexError が発生する
  answer: 2
  explanation: 負のインデックスは末尾から数える。`-1` は最後の要素。
- id: py-002
  difficulty: 1
  question: 次のうち、イミュータブル (変更不可) な型はどれか?
  choices:
  - list
  - dict
  - set
  - tuple
  answer: 3
  explanation: tuple と str, frozenset, int などはイミュータブル。list / dict / set は要素を変更できる。
