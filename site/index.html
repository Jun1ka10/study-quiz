<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Study Quiz</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="btn-home" class="link" aria-label="ホームへ">Study Quiz</button>
    <span id="offline-badge" class="badge" hidden>オフライン</span>
  </header>

  <main id="app" class="screen"></main>

  <template id="tpl-home">
    <section>
      <h1>何を勉強する?</h1>
      <div id="category-list" class="cards"></div>
      <div class="row">
        <label>出題数
          <select id="count">
            <option value="5">5 問</option>
            <option value="10" selected>10 問</option>
            <option value="20">20 問</option>
            <option value="0">全部</option>
          </select>
        </label>
        <label><input type="checkbox" id="weak-first" checked> 苦手優先</label>
      </div>
      <button id="btn-start" class="primary big" disabled>スタート</button>
      <h2>成績</h2>
      <div id="stats"></div>
      <button id="btn-reset" class="link danger">成績をリセット</button>
    </section>
  </template>

  <template id="tpl-quiz">
    <section>
      <div class="progress"><div id="progress-bar"></div></div>
      <p class="meta"><span id="q-index"></span> ・ <span id="q-category"></span> ・ <span id="q-difficulty"></span></p>
      <div id="q-text" class="question"></div>
      <div id="choices" class="choices"></div>
      <div id="feedback" class="feedback" hidden>
        <p id="feedback-result" class="result"></p>
        <div id="feedback-explanation"></div>
        <button id="btn-next" class="primary big">次へ</button>
      </div>
    </section>
  </template>

  <template id="tpl-result">
    <section>
      <h1>結果</h1>
      <p class="score"><span id="score"></span></p>
      <div id="wrong-list"></div>
      <button id="btn-retry-wrong" class="primary big" hidden>間違えた問題だけもう一度</button>
      <button id="btn-back" class="big">ホームへ</button>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
