# 「設計とは何か」の確認問題。lesson は隣の 01-what-is-design.md の id と一致させる。answer は choices の添字 (0 始まり)
lesson: de-01
questions:
- id: de-l01-1
  difficulty: 1
  question: ソフトウェア設計の良し悪しを測る、最も基本的な物差しは?
  choices:
  - 行数の少なさ
  - 変更のしやすさ
  - 使っているライブラリの新しさ
  - クラスの数
  answer: 1
  explanation: コードは書く時間より変更される時間の方が長い。変更が局所で済み、他を壊さないことが良い設計。
- id: de-l01-2
  difficulty: 1
  question: 「高凝集」とは?
  choices:
  - モジュール内の要素が 1 つの目的のために強く関連している
  - モジュールが他の多くのモジュールに依存している
  - 1 つのファイルにすべてを書く
  - クラスのメソッドが多い
  answer: 0
  explanation: 凝集はモジュール内のまとまり。関係ないものが同居していると低凝集で、変更理由が複数になる。
- id: de-l01-3
  difficulty: 2
  question: 次のうち「結合が強すぎる」兆候はどれか?
  choices:
  - A を直すと B も C も直さないと動かない
  - A の関数名が長い
  - A のテストが多い
  - A にコメントが無い
  answer: 0
  explanation: 変更が連鎖するのは結合が強い証拠。インターフェースを挟む、依存を減らす、責務を分けるといった手当てをする。
