category: design
title: 設計
questions:
  - id: de-001
    difficulty: 1
    question: "SOLID 原則の「S」= 単一責任の原則 (SRP) が言っていることは?"
    choices:
      - "クラスは 1 つのメソッドしか持ってはいけない"
      - "クラス (モジュール) を変更する理由は 1 つだけであるべき"
      - "1 ファイルに 1 クラスだけ書く"
      - "関数は 1 行で書く"
    answer: 1
    explanation: "SRP は「変更理由が 1 つ」。責務が混ざると片方の変更がもう片方を壊す。メソッド数や行数の話ではない。"

  - id: de-002
    difficulty: 2
    question: "オープン・クローズドの原則 (OCP) を満たす設計はどれか?"
    choices:
      - "新しい支払い方法を追加するたびに if 文を 1 つ増やす"
      - "支払い方法をインターフェースにして、新しい実装クラスを追加するだけで済むようにする"
      - "すべての支払い処理を 1 つの巨大な関数にまとめる"
      - "支払い方法はコードに書かず全部設定ファイルにする"
    answer: 1
    explanation: "拡張に開き、修正に閉じる = 既存コードを触らずに振る舞いを追加できる。抽象 (インターフェース) に依存させるのが典型手段。"

  - id: de-003
    difficulty: 2
    question: "依存性逆転の原則 (DIP) の説明として正しいものは?"
    choices:
      - "下位モジュールが上位モジュールに依存する"
      - "上位モジュールも下位モジュールも抽象に依存し、抽象は詳細に依存しない"
      - "依存関係は必ず循環させる"
      - "DI コンテナを使わなければならない"
    answer: 1
    explanation: "ビジネスロジック (上位) が DB や HTTP (下位の詳細) を直接 import しないように、間に抽象を置く。DI コンテナは手段の 1 つに過ぎない。"

  - id: de-004
    difficulty: 1
    question: "「疎結合・高凝集」の意味として正しい組み合わせは?"
    choices:
      - "モジュール間の依存が少なく、モジュール内の要素が強く関連している"
      - "モジュール間の依存が多く、モジュール内の要素がばらばら"
      - "モジュール数が少なく、ファイルが大きい"
      - "モジュール数が多く、ファイルが小さい"
    answer: 0
    explanation: "凝集 = 中身のまとまり、結合 = 外との依存度。関連するものを一か所に集め、外への依存を減らすのが良い設計の基本形。"

  - id: de-005
    difficulty: 2
    question: "次のコードで問題になっている設計の匂い (code smell) は?\n\n```python\ndef process(order, mode):\n    if mode == 'email':\n        ...\n    elif mode == 'slack':\n        ...\n    elif mode == 'sms':\n        ...\n```"
    choices:
      - "フラグ引数による分岐。振る舞いごとに型 (Strategy) に分けるのが定石"
      - "関数名が短すぎる"
      - "引数が 2 つある"
      - "問題はない"
    answer: 0
    explanation: "mode で分岐する関数は mode が増えるたびに肥大化する (OCP 違反)。Notifier インターフェース + EmailNotifier / SlackNotifier のように分けると追加が局所化する。"

  - id: de-006
    difficulty: 2
    question: "レイヤードアーキテクチャ / クリーンアーキテクチャで、依存の向きとして正しいものは?"
    choices:
      - "ドメイン層が DB ライブラリに依存する"
      - "外側 (UI / DB / フレームワーク) が内側 (ドメイン / ユースケース) に依存し、内側は外側を知らない"
      - "すべての層が互いに依存してよい"
      - "UI 層が最も内側"
    answer: 1
    explanation: "依存は常に内向き。ドメインは純粋なロジックだけで、DB や Web フレームワークの都合を知らない。だからテストしやすく差し替えやすい。"

  - id: de-007
    difficulty: 2
    question: "Repository パターンの目的は?"
    choices:
      - "SQL を高速化する"
      - "永続化の詳細 (DB / ORM / ファイル) をドメインから隠し、コレクションのように扱えるインターフェースにする"
      - "キャッシュを自動化する"
      - "テーブルごとにクラスを作ること"
    answer: 1
    explanation: "ドメイン側は `repo.find_by_id(id)` のように呼ぶだけ。実装をインメモリに差し替えればユニットテストが DB 無しで書ける。"

  - id: de-008
    difficulty: 3
    question: "DDD (ドメイン駆動設計) の「集約 (Aggregate)」の説明として正しいものは?"
    choices:
      - "DB のテーブル結合のこと"
      - "整合性を一緒に保つべきオブジェクトの塊で、外部からは集約ルート経由でのみ変更する"
      - "すべてのエンティティをまとめた巨大なクラス"
      - "SQL の GROUP BY"
    answer: 1
    explanation: "例: Order と OrderLine は 1 つの集約で、ルートは Order。OrderLine を外から直接いじらせず Order のメソッドで変更させることで不変条件 (合計金額など) を守る。"

  - id: de-009
    difficulty: 2
    question: "REST API の設計で、リソースの一部だけを更新したいときに最も適切な HTTP メソッドは?"
    choices: ["GET", "POST", "PUT", "PATCH"]
    answer: 3
    explanation: "PUT は全体置換、PATCH は部分更新。GET は副作用なし、POST は新規作成や「その他の操作」。"

  - id: de-010
    difficulty: 2
    question: "「冪等 (idempotent) な操作」とは?"
    choices:
      - "1 回だけしか実行できない操作"
      - "何回実行しても結果が同じになる操作"
      - "実行するたびに結果が変わる操作"
      - "並列実行できない操作"
    answer: 1
    explanation: "リトライやメッセージの重複配信があっても安全にするための性質。`DELETE /items/1` や「状態を X にする」は冪等、「残高に 100 足す」は非冪等。"

  - id: de-011
    difficulty: 3
    question: "テストしやすい設計にするために最も効果的なものは?"
    choices:
      - "すべてをグローバル変数にして共有する"
      - "副作用 (I/O, 時刻, 乱数) を外から注入できるようにし、純粋なロジックと分離する"
      - "テストコードで本番 DB に接続する"
      - "private メソッドを全部 public にする"
    answer: 1
    explanation: "`now()` や DB アクセスを引数 / 依存として渡せば、テストでは固定値やフェイクに差し替えられる。ロジックが純粋関数に近づくほどテストは簡単になる。"

  - id: de-012
    difficulty: 1
    question: "YAGNI (You Aren't Gonna Need It) の意味は?"
    choices:
      - "将来必要になりそうな機能はあらかじめ全部作っておく"
      - "今必要でない機能は作らない"
      - "テストは書かなくてよい"
      - "設計は不要"
    answer: 1
    explanation: "推測で作った汎用化は当たらないことが多く、複雑さだけが残る。必要になった時点でリファクタリングして対応する方が安い。"

  - id: de-013
    difficulty: 3
    question: "マイクロサービス化の判断として最も妥当なものは?"
    choices:
      - "新規プロジェクトは最初からマイクロサービスにすべき"
      - "まずモジュール境界のはっきりしたモノリスで始め、組織やスケールの要請が出てから分割する"
      - "サービス数が多いほど良い設計"
      - "DB は全サービスで 1 つを共有する"
    answer: 1
    explanation: "分散システムはネットワーク障害・整合性・運用コストを持ち込む。境界が見えていない段階での分割は失敗しやすい (「モノリスファースト」)。"
