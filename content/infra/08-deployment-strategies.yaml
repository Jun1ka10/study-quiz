lesson: infra-08
questions:
- id: infra-l08-1
  difficulty: 1
  question: "デプロイ戦略で最も優先すべき性質は?"
  choices:
  - "速さ"
  - "壊れたときにすぐ戻せること。前のイメージ / リビジョンに 1 コマンドで戻せる形を先に作る"
  - "無停止"
  - "自動化"
  answer: 1
  explanation: "無停止も大事だが、戻せなければ障害が長引く。ロールバックを練習しておく。"
- id: infra-l08-2
  difficulty: 2
  question: "列の改名を伴うデプロイでローリング中に旧版が落ちた。正しい進め方は?"
  choices:
  - "一度全部止めて改名する"
  - "展開 → 契約の 2 段階。新列を追加し (旧版は無視、新版は両方に書く)、全部新版になってから別リリースで旧列を削除する"
  - "改名しない"
  - "新版を先に出してから改名する"
  answer: 1
  explanation: "追加は安全、削除と改名は 2 段階。NOT NULL 追加も NULL 許可 → 埋める → NOT NULL の順。"
- id: infra-l08-3
  difficulty: 2
  question: "カナリアリリースとは?"
  choices:
  - "新版を全ユーザーに一斉に出す"
  - "新版にトラフィックの一部 (5% など) だけ流し、エラー率やレイテンシを見て問題なければ広げる"
  - "テスト環境で試す"
  - "夜間に出す"
  answer: 1
  explanation: "Cloud Run のトラフィック分割や ALB の重み付けで実現。監視が無いと意味がない。"
- id: infra-l08-4
  difficulty: 2
  question: "フィーチャーフラグの利点として正しいのは?"
  choices:
  - "コードが減る"
  - "未完成の機能を隠したまま小さな PR で main に入れられ、問題が出たらデプロイ無しで OFF にできる。役目を終えたら消す"
  - "テストが不要になる"
  - "デプロイが不要になる"
  answer: 1
  explanation: "長寿命のブランチを避けられる。フラグを消さないと分岐が積もる。"
- id: infra-l08-5
  difficulty: 1
  question: "デプロイ直後にすべきことは?"
  choices:
  - "すぐ帰る"
  - "エラー率・レイテンシ・ログを 10〜15 分見て、主要な導線を手で触り、デプロイの記録を残す"
  - "次のデプロイを始める"
  - "何もしない"
  answer: 1
  explanation: "デプロイ直後が最も壊れる時間帯。見ていれば数分で戻せる。"
