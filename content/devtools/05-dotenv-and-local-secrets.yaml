lesson: dt-05
questions:
- id: dt-l05-1
  difficulty: 1
  question: "`.env.example` をコミットする目的は?"
  choices:
  - "本番の設定を共有する"
  - "「どの環境変数が必要か」の一覧を値なしで共有し、新しい人が cp して埋めるだけにする"
  - "バックアップ"
  - "目的は無い"
  answer: 1
  explanation: ".env 本体は gitignore、.env.example は値を空にしてコミット。"
- id: dt-l05-2
  difficulty: 2
  question: "設定を `os.environ[\"X\"]` で都度読むのではなく BaseSettings のような設定クラスにまとめる利点は?"
  choices:
  - "速い"
  - "起動時に必須項目と型を検証でき、「設定し忘れて特定の画面だけ落ちる」を防げる。設定の一覧が 1 か所になる"
  - "環境変数が不要になる"
  - "利点は無い"
  answer: 1
  explanation: "Django なら django-environ で同様。読む場所を 1 か所にすると差し替えも楽。"
- id: dt-l05-3
  difficulty: 1
  question: "本番のコンテナに `.env` ファイルを含める設計の問題は?"
  choices:
  - "問題ない"
  - "イメージを pull できる人全員に秘密が見える。本番は Secret Manager などから実行時に環境変数として注入する"
  - "起動が遅くなる"
  - "ファイルが大きい"
  answer: 1
  explanation: "コードは常に環境変数を読むだけ。手元は .env、本番は注入、と出所だけ変える。"
- id: dt-l05-4
  difficulty: 1
  question: "テストで使う API キーは?"
  choices:
  - "本番のキー"
  - "テスト用のキー (Stripe の sk_test_ など) か、外部を呼ばない Fake。本物のキーをテストに使わない"
  - "誰かのキーを借りる"
  - "キーは不要"
  answer: 1
  explanation: "テストが誤って本番のデータを変えたり課金したりする事故を防ぐ。"
