lesson: de-04
questions:
- id: de-l04-1
  difficulty: 1
  question: "エンティティと値オブジェクトの違いは?"
  choices:
  - "同じ"
  - "エンティティは ID で識別し状態が変わる (ユーザー、請求書)。値オブジェクトは値が同じなら同じで不変 (金額、メールアドレス)"
  - "値オブジェクトは DB に保存できない"
  - "エンティティは不変"
  answer: 1
  explanation: "「同じもの」の判断基準が違う。値オブジェクトは生成時に検証し、以後変えない。"
- id: de-l04-2
  difficulty: 2
  question: "集約 (Aggregate) とは?"
  choices:
  - "SQL の GROUP BY"
  - "一緒に整合性を守るべきエンティティ・値オブジェクトの塊。外からは集約ルート経由でだけ変更し、1 トランザクションで 1 集約を更新する"
  - "全エンティティをまとめた巨大クラス"
  - "テーブルの結合"
  answer: 1
  explanation: "請求書と明細は 1 つの集約 (合計と発行後不変を一緒に守る)。顧客は別の集約で ID 参照。"
- id: de-l04-3
  difficulty: 2
  question: "`invoice.lines.append(line)` を外部から呼べる設計の問題は?"
  choices:
  - "問題ない"
  - "集約ルートのルール (発行後は変更不可、合計の再計算) を迂回できる。`invoice.add_line()` だけを入口にする"
  - "遅い"
  - "型が合わない"
  answer: 1
  explanation: "内部のコレクションは読み取り専用で公開し、変更は必ずメソッド経由にする。"
- id: de-l04-4
  difficulty: 2
  question: "金額を int ではなく `Money` 値オブジェクトにする利点は?"
  choices:
  - "利点は無い"
  - "負の金額や通貨違いの演算を生成時・演算時に弾ける。「金額」という業務の概念が型として現れ、引数の取り違えも防げる"
  - "速い"
  - "DB に保存しやすい"
  answer: 1
  explanation: "「プリミティブ型への執着」という匂いの対処。int の amount と int の quantity を取り違える事故が消える。"
- id: de-l04-5
  difficulty: 1
  question: "DDD で最初にやるべきことは?"
  choices:
  - "CQRS を導入する"
  - "業務の人が使う言葉をそのままコードの名前にする (ユビキタス言語)。`issue()` `passed` のように"
  - "マイクロサービスに分割する"
  - "全部のクラスにインターフェースを作る"
  answer: 1
  explanation: "道具より言葉。仕様の会話とコードが同じ語彙になるだけで、ずれと誤解が減る。"
