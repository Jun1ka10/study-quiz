<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Study Quiz</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="btn-home" class="link" aria-label="ホームへ">Study Quiz</button>
    <span id="offline-badge" class="badge" hidden>オフライン</span>
    <button id="btn-update" class="update-btn" hidden>新しい版があります。タップで更新</button>
  </header>

  <main id="app" class="screen"></main>

  <!-- ホーム: 今日の復習 / コース一覧 / ランダム演習 / 成績 -->
  <template id="tpl-home">
    <section>
      <button id="btn-review" class="review-card">
        <span class="review-title">今日の復習</span>
        <span id="review-count" class="review-count"></span>
        <span id="review-note" class="review-note"></span>
      </button>

      <h2>コース</h2>
      <div id="courses"></div>

      <h2>ランダム演習</h2>
      <div class="row">
        <label>範囲
          <select id="rand-category"></select>
        </label>
        <label>出題数
          <select id="count">
            <option value="5">5 問</option>
            <option value="10" selected>10 問</option>
            <option value="20">20 問</option>
            <option value="0">全部</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label><input type="checkbox" id="weak-first" checked> 苦手優先</label>
        <label><input type="checkbox" id="learned-only" checked> 学習済みの範囲だけ</label>
      </div>
      <button id="btn-start" class="big">スタート</button>

      <h2>成績</h2>
      <div id="stats"></div>
      <button id="btn-reset" class="link danger">学習記録をリセット</button>

      <h2>アプリ</h2>
      <p class="meta">版: <span id="app-version"></span> (<span id="app-built"></span>)</p>
      <button id="btn-check-update" class="link">更新を確認</button>
      <p id="update-status" class="meta"></p>
    </section>
  </template>

  <!-- レッスン (教科書ページ) -->
  <template id="tpl-lesson">
    <section>
      <p class="meta"><span id="lesson-category"></span> ・ <span id="lesson-position"></span> ・ 約 <span id="lesson-minutes"></span> 分</p>
      <h1 id="lesson-title"></h1>
      <p id="lesson-status" class="meta" hidden></p>
      <article id="lesson-body" class="lesson-body"></article>
      <button id="btn-lesson-quiz" class="primary big"></button>
      <button id="btn-lesson-back" class="big">コース一覧へ</button>
    </section>
  </template>

  <!-- 出題 -->
  <template id="tpl-quiz">
    <section>
      <div class="progress"><div id="progress-bar"></div></div>
      <p class="meta"><span id="q-mode"></span> ・ <span id="q-index"></span> ・ <span id="q-category"></span> ・ <span id="q-difficulty"></span></p>
      <div id="q-text" class="question"></div>
      <div id="choices" class="choices"></div>
      <button id="btn-unknown" class="unknown">わからない</button>
      <div id="feedback" class="feedback" hidden>
        <p id="feedback-result" class="result"></p>
        <div id="feedback-explanation"></div>
        <button id="btn-next" class="primary big">次へ</button>
      </div>
    </section>
  </template>

  <!-- 結果 -->
  <template id="tpl-result">
    <section>
      <h1 id="result-title">結果</h1>
      <p class="score"><span id="score"></span></p>
      <p id="result-note" class="meta center"></p>
      <button id="btn-next-lesson" class="primary big" hidden></button>
      <button id="btn-reread" class="big" hidden>もう一度読む</button>
      <button id="btn-retry-wrong" class="big" hidden>間違えた問題だけもう一度</button>
      <button id="btn-retry-all" class="big" hidden>全部もう一度</button>
      <div id="wrong-list"></div>
      <button id="btn-back" class="big">ホームへ</button>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
