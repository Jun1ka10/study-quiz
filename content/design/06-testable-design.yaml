lesson: de-06
questions:
- id: de-l06-1
  difficulty: 1
  question: "関数の中で `datetime.now()` を呼ぶとテストで困る理由は?"
  choices:
  - "遅い"
  - "実行する日時で結果が変わり、「月末の場合」「土曜の場合」を固定して検証できない。時刻は引数や Clock で注入する"
  - "エラーになる"
  - "困らない"
  answer: 1
  explanation: "乱数、UUID、環境変数も同じ。外から渡せば固定できる。"
- id: de-l06-2
  difficulty: 2
  question: "「計算と副作用を分ける」とは?"
  choices:
  - "関数を短くする"
  - "入力から出力を決める部分を純粋関数として切り出し、DB 書き込みや通知などの副作用は薄い外側の手順に寄せる"
  - "副作用を無くす"
  - "全部 1 関数にまとめる"
  answer: 1
  explanation: "純粋関数は大量のケースを高速にテストでき、手順側は Fake で「呼ばれたか」を見るだけで済む。"
- id: de-l06-3
  difficulty: 2
  question: "Fake と Mock の使い分けとして適切なのは?"
  choices:
  - "常に Mock"
  - "Fake (動く簡易実装) を優先し、Mock は外部 SDK など差し替えにくい境界に限る。Mock の多用は実装の細部にテストが結合する"
  - "常に Fake"
  - "どちらも使わず本物を使う"
  answer: 1
  explanation: "Fake はリファクタリングに強く読みやすい。Mock は「このメソッドがこの引数で呼ばれた」を検証するので内部構造が変わると壊れる。"
- id: de-l06-4
  difficulty: 1
  question: "テストピラミッドの考え方は?"
  choices:
  - "E2E を一番多く"
  - "速いユニットテストを最も多く、統合テストを中程度、遅い E2E を少なく"
  - "全部同じ数"
  - "ユニットテストは不要"
  answer: 1
  explanation: "E2E だけに頼ると遅く、壊れやすく、原因の特定が難しい。"
