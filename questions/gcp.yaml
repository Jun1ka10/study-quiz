category: gcp
title: GCP
questions:
  - id: gcp-001
    difficulty: 1
    question: "GCP のオブジェクトストレージサービスは?"
    choices: ["Persistent Disk", "Cloud Storage", "Filestore", "Bigtable"]
    answer: 1
    explanation: "Cloud Storage (GCS) が AWS S3 に相当。Persistent Disk はブロック、Filestore はファイル。"

  - id: gcp-002
    difficulty: 1
    question: "GCP のリソース階層で、プロジェクトの上に位置するものは?"
    choices: ["リージョン", "フォルダ / 組織", "VPC", "ゾーン"]
    answer: 1
    explanation: "組織 → フォルダ → プロジェクト → リソース の階層。IAM ポリシーは上位から継承される。"

  - id: gcp-003
    difficulty: 1
    question: "コンテナイメージをそのまま渡すと自動スケールして HTTP を受けてくれるサーバーレスサービスは?"
    choices: ["Compute Engine", "Cloud Run", "Cloud Functions", "App Engine Standard"]
    answer: 1
    explanation: "Cloud Run はコンテナベースのサーバーレス。Cloud Functions は関数単位、App Engine は言語ランタイム指定。"

  - id: gcp-004
    difficulty: 2
    question: "GCP の VPC ネットワークの特徴として正しいものは?"
    choices:
      - "VPC はリージョンに閉じる"
      - "VPC はグローバルで、サブネットがリージョナル"
      - "サブネットはゾーン単位"
      - "VPC はゾーン単位"
    answer: 1
    explanation: "AWS の VPC はリージョナルだが、GCP の VPC はグローバル。サブネットはリージョン単位で、1 つの VPC に複数リージョンのサブネットを持てる。"

  - id: gcp-005
    difficulty: 2
    question: "BigQuery の課金 (オンデマンド) で主に費用が決まるものは?"
    choices: ["クエリの実行時間", "スキャンしたデータ量", "同時接続数", "返却行数"]
    answer: 1
    explanation: "オンデマンドはスキャンバイト数課金。`SELECT *` を避け、パーティション / クラスタリングでスキャン量を減らすのが基本。"

  - id: gcp-006
    difficulty: 2
    question: "サービスアカウントについて正しいものは?"
    choices:
      - "人間のユーザーがログインに使う"
      - "アプリケーションや VM が API を呼ぶためのアイデンティティ"
      - "プロジェクトごとに 1 つしか作れない"
      - "IAM ロールを付与できない"
    answer: 1
    explanation: "サービスアカウントは非人間用のアイデンティティ。IAM ロールを付与でき、VM や Cloud Run にアタッチしてキーレスで認証できる。"

  - id: gcp-007
    difficulty: 2
    question: "Cloud SQL と Cloud Spanner の使い分けとして正しいものは?"
    choices:
      - "Spanner は小規模な MySQL 互換 DB 向け"
      - "Cloud SQL はグローバル分散・水平スケールが必要な場合向け"
      - "Cloud SQL は MySQL / PostgreSQL 等のマネージド、Spanner はグローバル分散で水平スケールする RDB"
      - "どちらも NoSQL"
    answer: 2
    explanation: "Cloud SQL は既存 RDB のマネージド版。Spanner は強整合性を保ったまま水平スケールできる独自 RDB で高価。"

  - id: gcp-008
    difficulty: 2
    question: "Pub/Sub の役割は?"
    choices: ["リレーショナル DB", "非同期メッセージング (Publisher / Subscriber)", "CDN", "ログ保存"]
    answer: 1
    explanation: "Pub/Sub はトピックにメッセージを発行し、サブスクリプションで受け取る非同期メッセージング。AWS の SNS + SQS に近い。"

  - id: gcp-009
    difficulty: 3
    question: "GKE Autopilot モードの特徴は?"
    choices:
      - "ノードを自分で管理し細かく制御できる"
      - "ノード管理を Google に任せ、Pod のリソース要求単位で課金される"
      - "コントロールプレーンを自分でホストする"
      - "GPU が使えない"
    answer: 1
    explanation: "Autopilot はノードプールの管理不要で Pod 単位課金。細かいノード制御が必要なら Standard モード。"

  - id: gcp-010
    difficulty: 3
    question: "IAM ロールの種類で「必要最小限の権限」を実現しやすい順に並べたものは?"
    choices:
      - "基本ロール (Owner/Editor) > 事前定義ロール > カスタムロール"
      - "カスタムロール > 事前定義ロール > 基本ロール"
      - "事前定義ロール > 基本ロール > カスタムロール"
      - "どれも同じ粒度"
    answer: 1
    explanation: "基本ロールは粗すぎるので本番では避ける。まず事前定義ロールを探し、足りなければカスタムロールを作る。"

  - id: gcp-011
    difficulty: 2
    question: "Cloud Build のトリガーで一般的に起点にするものは?"
    choices: ["Cloud Storage のバケット削除", "Git リポジトリへの push / タグ", "BigQuery のクエリ完了", "VM の再起動"]
    answer: 1
    explanation: "Cloud Build は GitHub / Cloud Source Repositories 等の push やタグをトリガーにビルド・デプロイする CI/CD。"

  - id: gcp-012
    difficulty: 1
    question: "GCP でプロジェクトのログを一元的に見るサービスは?"
    choices: ["Cloud Logging", "Cloud Trace", "Cloud Profiler", "Error Reporting"]
    answer: 0
    explanation: "Cloud Logging がログ集約。Trace は分散トレース、Profiler は CPU / メモリプロファイル、Error Reporting は例外集計。"
