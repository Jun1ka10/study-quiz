lesson: infra-09
questions:
- id: infra-l09-1
  difficulty: 1
  question: "SLI / SLO / SLA の関係として正しいのは?"
  choices:
  - "全部同じ"
  - "SLI は測る指標、SLO はその目標値、SLA は顧客との契約 (罰則付き)。SLA は SLO より緩く設定する"
  - "SLA が最も厳しい"
  - "SLI は契約"
  answer: 1
  explanation: "内部目標 (SLO) を破っても契約 (SLA) は守れる余裕を持たせる。"
- id: infra-l09-2
  difficulty: 2
  question: "SLO 99.9% (30 日) のエラーバジェットはおよそ?"
  choices:
  - "約 4 分"
  - "約 43 分 (30 日 × 0.1%)"
  - "約 7 時間"
  - "約 1 日"
  answer: 1
  explanation: "30 日 = 43,200 分。0.1% で 43.2 分。99.5% なら 216 分 (3.6 時間)。"
- id: infra-l09-3
  difficulty: 2
  question: "レイテンシの監視で平均ではなくパーセンタイルを使う理由は?"
  choices:
  - "計算が簡単"
  - "平均は「大半が速く一部が極端に遅い」を隠す。p95 / p99 で遅い側のユーザー体験が見える"
  - "パーセンタイルの方が小さい値になる"
  - "理由は無い"
  answer: 1
  explanation: "p95 が 3 秒なら 20 人に 1 人が 3 秒以上待っている。"
- id: infra-l09-4
  difficulty: 2
  question: "「CPU 使用率 90%」でページ (即時対応のアラート) を鳴らす設計の問題は?"
  choices:
  - "問題ない"
  - "CPU は原因候補であって症状ではない。ユーザー影響が無いのに起こされ、アラートが信用されなくなる。エラー率や p95 (症状) で鳴らし、CPU はダッシュボードかチケットに"
  - "CPU は測れない"
  - "90% は低すぎる"
  answer: 1
  explanation: "「鳴ったら必ず対応する」ものだけをページにする。"
- id: infra-l09-5
  difficulty: 1
  question: "障害が起きたときに最初に優先することは?"
  choices:
  - "根本原因の究明"
  - "緩和 (ロールバック、フラグ OFF、スケール) で影響を止めること。原因究明は収束後"
  - "報告書の作成"
  - "犯人探し"
  answer: 1
  explanation: "振り返りは人を責めず仕組みを直す。「気をつける」は対策にならない。"
