lesson: de-07
questions:
- id: de-l07-1
  difficulty: 1
  question: "リファクタリングの定義は?"
  choices:
  - "バグを直す"
  - "外から見た振る舞いを変えずに内部構造を改善すること。テストが通り続けることで保証する"
  - "機能を追加する"
  - "コードを短くする"
  answer: 1
  explanation: "機能追加と同じコミットに混ぜない。テストが無ければ先に特性テストを書く。"
- id: de-l07-2
  difficulty: 2
  question: "特性テスト (characterization test) とは?"
  choices:
  - "性能テスト"
  - "テストの無い既存コードに対し、今の出力をそのまま期待値として固定するテスト。リファクタリング中に振る舞いが変わっていないことを守る"
  - "型のテスト"
  - "UI のテスト"
  answer: 1
  explanation: "正しいかどうかではなく「変わっていないか」を見る。直し終わってから本当の仕様のテストに置き換える。"
- id: de-l07-3
  difficulty: 2
  question: "`if status == 2:` の匂いと直し方は?"
  choices:
  - "問題ない"
  - "魔法の数。`Status.ISSUED` のような Enum / 定数に名前を付ける"
  - "3 にする"
  - "コメントを書く"
  answer: 1
  explanation: "名前があれば読める。値の変更も 1 か所で済む。"
- id: de-l07-4
  difficulty: 2
  question: "大きなリファクタリングの進め方として正しいのは?"
  choices:
  - "全部書き直してから一度にテスト"
  - "1 手 (抽出・改名・分割) ごとにテストを回してコミットし、常に動く状態を保つ"
  - "テストを消してから直す"
  - "本番で試す"
  answer: 1
  explanation: "途中で壊れても 1 手戻せばよい。「全部きれいにしてから戻す」は戻せなくなる。"
- id: de-l07-5
  difficulty: 1
  question: "「似たコードが 2 か所」に共通化を急ぐべきでない場合は?"
  choices:
  - "常に共通化すべき"
  - "たまたま似ているだけで、変わる理由が別のとき。無理に共通化すると片方の変更がもう片方を壊す"
  - "共通化は不要"
  - "3 か所になるまで待つ必要は無い"
  answer: 1
  explanation: "重複より誤った抽象の方が高くつく。「一緒に変わるか」で判断する。"
