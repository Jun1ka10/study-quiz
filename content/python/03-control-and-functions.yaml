# 「制御構文と関数」の確認問題。lesson は隣の 03-control-and-functions.md の id と一致させる。answer は choices の添字 (0 始まり)
lesson: py-03
questions:
- id: py-l03-1
  difficulty: 1
  question: '`for i in range(3):` で `i` が取る値は?'
  choices:
  - 1, 2, 3
  - 0, 1, 2
  - 0, 1, 2, 3
  - 1, 2
  answer: 1
  explanation: range(n) は 0 から n-1 まで。range(1, 4) なら 1, 2, 3。
- id: py-l03-2
  difficulty: 1
  question: リストの要素と添字を同時に取り出す組み込み関数は?
  choices:
  - zip
  - enumerate
  - range
  - map
  answer: 1
  explanation: '`for i, x in enumerate(items):`。zip は複数のリストを並べて回す。'
- id: py-l03-3
  difficulty: 2
  question: |-
    次のコードの 2 回目の出力は?

    ```python
    def add(x, acc=[]):
        acc.append(x)
        return acc

    print(add(1))
    print(add(2))
    ```
  choices:
  - '[2]'
  - '[1, 2]'
  - '[1]'
  - エラー
  answer: 1
  explanation: デフォルト引数は定義時に 1 回だけ作られ、呼び出し間で共有される。ミュータブルなデフォルト値は `None` にして関数内で初期化する。
- id: py-l03-4
  difficulty: 2
  question: '`def greet(name, *, loud=False):` の `*` の意味は?'
  choices:
  - 可変長引数を受け取る
  - これ以降の引数はキーワード指定でしか渡せない
  - loud が必須になる
  - 文法エラー
  answer: 1
  explanation: '`*` 単独はキーワード専用引数の区切り。`greet("a", True)` はエラーで `greet("a", loud=True)` と書く必要がある。読みやすさのために使う。'
