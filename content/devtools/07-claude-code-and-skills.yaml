lesson: dt-07
questions:
- id: dt-l07-1
  difficulty: 1
  question: "CLAUDE.md に書くべき内容として適切なのは?"
  choices:
  - "コードの全ファイルの説明"
  - "よく使うコマンド、作法・禁止事項、判断基準を短く。詳細は docs/ を指す"
  - "ライセンス"
  - "何も書かない"
  answer: 1
  explanation: "毎回読み込まれるので短く具体的に。新メンバーに渡す「作業の作法」と同じ。"
- id: dt-l07-2
  difficulty: 2
  question: "スキル (SKILL.md) にすべきものは?"
  choices:
  - "1 回しかやらない作業"
  - "繰り返す定型の手順。「毎回同じ説明をしている」と気づいたもの。手順とコマンドと判断基準を明文化する"
  - "秘密情報"
  - "全部のコード"
  answer: 1
  explanation: "description に「いつ使うか」を書くと自動で選ばれる手がかりになる。"
- id: dt-l07-3
  difficulty: 2
  question: "エージェントに作業を頼むときに含めるべきものは?"
  choices:
  - "「いい感じに」"
  - "完成条件 (テストが通る、curl でこう返る)、参照先 (既存のこのコードに倣う)、やらないこと (スキーマは変えない)"
  - "できるだけ短く 1 語で"
  - "何も指定せず任せる"
  answer: 1
  explanation: "曖昧な依頼は曖昧な結果になる。大きい作業は計画を先に出させる。"
- id: dt-l07-4
  difficulty: 1
  question: "エージェントが「テストが通った」と報告した。次にすべきことは?"
  choices:
  - "そのままマージ"
  - "git diff とテストの出力を自分で読み、意図どおりか確認してから受け入れる。判断はこちらが持つ"
  - "もう一度実行させる"
  - "何もしない"
  answer: 1
  explanation: "本番データや秘密に触る操作、設計判断は特に人が見る。権限設定でも破壊的操作は確認にする。"
